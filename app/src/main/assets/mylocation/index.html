<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>My Location</title>
    <link rel="icon" href="data:,">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: monospace;
        }
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        /* Google-Maps-style live position dot, in the app's green theme instead of blue - a real
           pulsing marker, not a static pin, so it reads immediately as "this is moving/live". */
        .my-location-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #4caf50;
            border: 3px solid #ffffff;
            box-shadow: 0 0 0 rgba(76, 175, 80, 0.6);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.6); }
            70% { box-shadow: 0 0 0 18px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
        #status-panel {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 16px;
            background: rgba(10, 10, 10, 0.85);
            color: #4caf50;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            line-height: 1.6;
            pointer-events: none;
        }
        #recenter-btn {
            position: fixed;
            right: 16px;
            bottom: 110px;
            background: rgba(0, 0, 0, 0.75);
            color: #4caf50;
            border: 1px solid #4caf50;
            border-radius: 8px;
            padding: 10px 16px;
            font-family: monospace;
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <button id="recenter-btn">RECENTER</button>
    <div id="status-panel">Getting your location...</div>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
    <script src="./mylocation.js"></script>
</body>
</html>
